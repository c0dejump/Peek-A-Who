<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geotime map — {{ case.title }}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#30363d;
            --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --gold:#e3b341; --green:#3fb950; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; align-items: center; gap: 1.2rem; padding: .7rem 1.2rem; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    nav a { color: var(--muted); text-decoration: none; font-size: .82rem; }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--text); }
    .nav-title { color: var(--gold); font-weight: 600; font-size: .82rem; margin-left: auto; }
    .wrap { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; background: var(--surface2); }
    .side { width: 320px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 1rem; flex-shrink: 0; }
    .side h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .7rem; }
    .pt { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .7rem; margin-bottom: .55rem; cursor: pointer; }
    .pt:hover { border-color: var(--accent); }
    .pt-loc { font-size: .82rem; font-weight: 600; color: var(--text); }
    .pt-when { font-size: .74rem; color: var(--gold); margin-top: .15rem; }
    .pt-note { font-size: .74rem; color: var(--muted); margin-top: .2rem; }
    .pt-nogeo { font-size: .68rem; color: #f0883e; margin-top: .2rem; }
    .mini { background: transparent; border: none; cursor: pointer; font-size: .78rem; padding: 0 .15rem; opacity: .7; }
    .mini:hover { opacity: 1; }
    .pt { cursor: grab; }
    .pt.dragging { opacity: .45; }
    .pt.drop-before { border-top: 2px solid var(--accent); }
    .drag-h { color: var(--muted); cursor: grab; font-size: .8rem; margin-right: .1rem; }
    .addbox { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .7rem; margin-bottom: 1rem; }
    .addbox input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: .4rem .5rem; font-size: .8rem; margin-bottom: .45rem; }
    .addbox button { width: 100%; background: var(--accent); color: #08111f; border: none; border-radius: 6px; padding: .45rem; font-weight: 600; font-size: .8rem; cursor: pointer; }
    .addbox button:disabled { opacity: .5; }
    .empty { color: var(--muted); font-size: .8rem; text-align: center; padding: 2rem 0; }
    .leaflet-popup-content { font-size: .82rem; }
    .leaflet-popup-content b { color: #1a1a1a; }
    .traj-num { background: #e3b341; color: #1a1a1a; border: none; border-radius: 10px;
                font-weight: 700; font-size: .7rem; padding: 1px 6px; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .traj-num::before { display: none; }
  </style>
  <style id="paw-transitions">
    /* Smooth cross-page navigation — Chromium multi-page View Transitions */
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: no-preference) {
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: .28s; }
    }
    /* Fallback: gently fade the page in on load where view transitions are unsupported */
    @supports not (view-transition-name: none) {
      @media (prefers-reduced-motion: no-preference) {
        @keyframes paw-page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        body { animation: paw-page-in .30s ease both; }
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">New investigation</a>
    <a href="/investigation">Terminal</a>
    <a href="/cases">Cases</a>
    <a href="/cases/{{ case.id }}">← Graph</a>
    <a href="#" class="active">🗺️ Map</a>
    <span class="nav-title">{{ case.title }}</span>
  </nav>
  <div class="wrap">
    <div id="map"></div>
    <div class="side">
      <div class="addbox">
        <h2>Add a sighting</h2>
        <div style="font-size:.7rem;color:var(--muted);margin-bottom:.55rem">💡 Or <b>click anywhere on the map</b> to drop a precise pin.</div>
        <input id="in-loc"  placeholder="Place (e.g. Bar Le Comptoir)" />
        <input id="in-when" placeholder="When (e.g. 2024-06-20 17:00 or 17h)" />
        <input id="in-near" placeholder="City (helps geocoding, optional)" />
        <input id="in-note" placeholder="Note (optional)" />
        <button id="add-btn" onclick="addPoint()">📍 Add to map</button>
        <div style="border-top:1px solid var(--border);margin:.7rem 0 .55rem"></div>
        <div style="font-size:.7rem;color:var(--muted);margin-bottom:.4rem">📷 Drop a photo → GPS + date extracted automatically</div>
        <input type="file" id="in-photo" accept="image/*" style="font-size:.72rem;padding:.3rem" />
        <button id="photo-btn" onclick="uploadPhoto()" style="margin-top:.45rem">📷 Add from photo</button>
      </div>
      <label style="display:flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--text);margin-bottom:.7rem;cursor:pointer">
        <input type="checkbox" id="trajToggle" checked onchange="render()" /> 🧭 Show trajectory (chronological path)
      </label>
      <h2>Sightings (<span id="count">0</span>)</h2>
      <div id="list"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CASE_ID = {{ case.id | tojson }};
    let points = {{ points_json | safe }};
    const map = L.map('map').setView([46.6, 2.2], 5);   // France by default
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19,
    }).addTo(map);
    const markers = {};

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    let trajLine = null;

    function _timeKey(p) {
      const w = (p.when || '').trim();
      let t = Date.parse(w);
      if (!isNaN(t)) return t;
      const m = w.match(/\d{4}-\d{2}-\d{2}/);
      if (m) { t = Date.parse(m[0]); if (!isNaN(t)) return t; }
      t = Date.parse(p.added_at || '');
      return isNaN(t) ? 0 : t;
    }
    // Order comparator: manual seq (if set) wins, else chronological time
    function _cmp(a, b) {
      const sa = (a.seq == null) ? Infinity : a.seq, sb = (b.seq == null) ? Infinity : b.seq;
      if (sa !== sb) return sa - sb;
      return _timeKey(a) - _timeKey(b);
    }

    function render() {
      // clear markers + trajectory
      Object.values(markers).forEach(m => map.removeLayer(m));
      Object.keys(markers).forEach(k => delete markers[k]);
      if (trajLine) { map.removeLayer(trajLine); trajLine = null; }
      const list = document.getElementById('list');
      list.innerHTML = '';
      document.getElementById('count').textContent = points.length;
      if (!points.length) { list.innerHTML = '<div class="empty">No sightings yet.<br>Tell Raphael “X était à tel endroit à telle heure”, drop a photo, or click the map.</div>'; return; }

      // Order = manual seq first (if set), else chronological
      const geo = points.filter(p => p.lat != null && p.lon != null).sort(_cmp);
      const orderNum = {}; geo.forEach((p,i) => orderNum[p.id] = i + 1);

      // Trajectory polyline (person's path over time) — casing + bright line for visibility
      const showTraj = document.getElementById('trajToggle').checked;
      if (showTraj && geo.length >= 2) {
        const coords = geo.map(p => [p.lat, p.lon]);
        const casing = L.polyline(coords, { color: '#000', weight: 8, opacity: .35 });
        const line   = L.polyline(coords, { color: '#ff2d78', weight: 4, opacity: .95 });
        trajLine = L.layerGroup([casing, line]).addTo(map);
      }

      // Numbered, DRAGGABLE markers
      const bounds = [];
      geo.forEach(p => {
        const n = orderNum[p.id];
        const m = L.marker([p.lat, p.lon], { draggable: true, autoPan: true }).addTo(map);
        const sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
        const fl = `https://www.flickr.com/map?&fLat=${p.lat}&fLon=${p.lon}&zl=15`;
        m.bindPopup(`<b>#${n} — 📍 ${esc(p.location)}</b>${p.when?`<br>⏱ ${esc(p.when)}`:''}${p.note?`<br>${esc(p.note)}`:''}<br><small>${esc(p.display||'')}</small>`
          + `<br><a href="${sv}" target="_blank">🛰️ Street View</a> · <a href="${fl}" target="_blank">📷 Photos here</a>`
          + `<br><i style="color:#666">drag to move</i>`);
        m.bindTooltip(String(n), { permanent: true, direction: 'top', className: 'traj-num', offset: [0,-8] });
        m.on('dragend', async () => {
          const ll = m.getLatLng();
          await saveEdit(p.id, { lat: ll.lat, lon: ll.lng });
        });
        markers[p.id] = m;
        bounds.push([p.lat, p.lon]);
      });

      // Sidebar list in trajectory order (#1 at top) — drag to reorder, edit/delete
      const listSorted = [...points].sort(_cmp);
      listSorted.forEach((p) => {
        const div = document.createElement('div');
        div.className = 'pt';
        div.draggable = true;
        div.dataset.id = p.id;
        const badge = orderNum[p.id] ? `<span style="color:#e3b341;font-weight:700">#${orderNum[p.id]} </span>` : '';
        div.innerHTML = `<div class="pt-loc"><span class="drag-h" title="Drag to reorder">⠿</span> ${badge}📍 ${esc(p.location)}
            <span style="float:right">
              <button class="mini" title="Edit" onclick="event.stopPropagation();editSighting('${p.id}')">✏️</button>
              <button class="mini" title="Delete" onclick="event.stopPropagation();deleteSighting('${p.id}')">🗑️</button>
            </span></div>
          ${p.when ? `<div class="pt-when">⏱ ${esc(p.when)}</div>` : ''}
          ${p.note ? `<div class="pt-note">${esc(p.note)}</div>` : ''}
          ${(p.lat==null) ? `<div class="pt-nogeo">⚠ not geocoded — no pin</div>` : ''}`;
        if (p.lat != null && p.lon != null) {
          div.onclick = () => { map.setView([p.lat, p.lon], 15); markers[p.id].openPopup(); };
        }
        list.appendChild(div);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [45,45], maxZoom: 14 });
    }

    // ── Drag-and-drop reordering of the sighting list ──────────────────────────
    let _dragId = null;
    const _listEl = document.getElementById('list');
    _listEl.addEventListener('dragstart', e => {
      const item = e.target.closest('.pt'); if (!item) return;
      _dragId = item.dataset.id; item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    _listEl.addEventListener('dragend', e => {
      const item = e.target.closest('.pt'); if (item) item.classList.remove('dragging');
      _listEl.querySelectorAll('.drop-before').forEach(el => el.classList.remove('drop-before'));
    });
    _listEl.addEventListener('dragover', e => {
      e.preventDefault();
      const over = e.target.closest('.pt');
      _listEl.querySelectorAll('.drop-before').forEach(el => el.classList.remove('drop-before'));
      if (over && over.dataset.id !== _dragId) over.classList.add('drop-before');
    });
    _listEl.addEventListener('drop', async e => {
      e.preventDefault();
      const over = e.target.closest('.pt');
      if (!_dragId) return;
      const targetId = over ? over.dataset.id : null;   // drop before this item (null = end)
      // Rebuild the order from the current DOM order, moving _dragId before targetId
      const ids = [...points].sort(_cmp).map(p => p.id).filter(id => id !== _dragId);
      const at = targetId ? ids.indexOf(targetId) : ids.length;
      ids.splice(at < 0 ? ids.length : at, 0, _dragId);
      _dragId = null;
      // Apply seq locally, render, persist
      ids.forEach((id, idx) => { const lp = points.find(x => x.id === id); if (lp) lp.seq = idx; });
      render();
      try {
        await fetch(`/cases/${CASE_ID}/geotime/reorder`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ order: ids }),
        });
      } catch(err) { /* local order already applied */ }
    });

    // Persist an edit/move to the server, then update local state
    async function saveEdit(id, changes) {
      try {
        const r = await fetch(`/cases/${CASE_ID}/geotime/${id}`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(changes),
        });
        const data = await r.json();
        if (data.ok) {
          const idx = points.findIndex(x => x.id === id);
          if (idx >= 0) points[idx] = { ...points[idx], ...data.point };
          render();
        } else alert('Error: ' + (data.error||'unknown'));
      } catch(e) { alert('Request failed: ' + e); }
    }

    function editSighting(id) {
      const p = points.find(x => x.id === id); if (!p) return;
      const location = prompt('Place:', p.location || ''); if (location === null) return;
      const when = prompt('When (e.g. 2024-06-20 17:00):', p.when || ''); if (when === null) return;
      const note = prompt('Note:', p.note || ''); if (note === null) return;
      saveEdit(id, { location: location.trim(), when: when.trim(), note: note.trim() });
    }

    async function deleteSighting(id) {
      if (!confirm('Delete this sighting?')) return;
      try {
        const r = await fetch(`/cases/${CASE_ID}/geotime/${id}`, { method:'DELETE' });
        const data = await r.json();
        if (data.ok) { points = points.filter(x => x.id !== id); render(); }
        else alert('Error: ' + (data.error||'unknown'));
      } catch(e) { alert('Request failed: ' + e); }
    }

    async function uploadPhoto() {
      const inp = document.getElementById('in-photo');
      if (!inp.files || !inp.files[0]) { alert('Choose a photo first.'); return; }
      const btn = document.getElementById('photo-btn');
      btn.disabled = true; btn.textContent = '📷 Reading EXIF…';
      const fd = new FormData(); fd.append('photo', inp.files[0]);
      try {
        const r = await fetch(`/cases/${CASE_ID}/geotime/photo`, { method:'POST', body: fd });
        const data = await r.json();
        if (data.ok) { points.push({ ...data.point }); inp.value=''; render(); }
        else alert(data.error || 'Could not read the photo.');
      } catch(e) { alert('Request failed: ' + e); }
      finally { btn.disabled = false; btn.textContent = '📷 Add from photo'; }
    }

    // Click anywhere on the map to drop a precise pin (Google-Maps style)
    map.on('click', async (e) => {
      const when = prompt('When was the target here? (e.g. 2024-06-20 17h, or leave blank)');
      if (when === null) return;   // cancelled
      const note = prompt('Note (optional):') || '';
      const { lat, lng } = e.latlng;
      try {
        const r = await fetch(`/cases/${CASE_ID}/geotime`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ lat, lon: lng, when: when.trim(), note: note.trim() }),
        });
        const data = await r.json();
        if (data.ok) { points.push({ ...data.point }); render(); }
        else alert('Error: ' + (data.error||'unknown'));
      } catch(err) { alert('Request failed: ' + err); }
    });

    async function addPoint() {
      const location = document.getElementById('in-loc').value.trim();
      if (!location) { alert('Enter a place.'); return; }
      const btn = document.getElementById('add-btn');
      btn.disabled = true; btn.textContent = '⏳ Geocoding…';
      try {
        const r = await fetch(`/cases/${CASE_ID}/geotime`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            location,
            when: document.getElementById('in-when').value.trim(),
            near: document.getElementById('in-near').value.trim(),
            note: document.getElementById('in-note').value.trim(),
          }),
        });
        const data = await r.json();
        if (data.ok) {
          points.push({ ...data.point });
          ['in-loc','in-when','in-near','in-note'].forEach(id => document.getElementById(id).value = '');
          render();
          if (!data.point.geocoded) alert(`Saved, but couldn't geocode “${location}” — try adding a city.`);
        } else { alert('Error: ' + (data.error||'unknown')); }
      } catch(e) { alert('Request failed: ' + e); }
      finally { btn.disabled = false; btn.textContent = '📍 Add to map'; }
    }

    render();

    // Focus a specific point when arriving from a graph node (?focus=<factId>)
    const _focusId = new URLSearchParams(location.search).get('focus');
    if (_focusId && markers[_focusId]) {
      const m = markers[_focusId];
      map.setView(m.getLatLng(), 16);
      m.openPopup();
    }
  </script>
</body>
</html>
